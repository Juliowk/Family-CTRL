name: CI frontend

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
