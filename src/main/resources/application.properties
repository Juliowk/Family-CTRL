spring.application.name=family-ctrl

# Sem perfil explicito, roda como "local" (Docker Compose)
spring.profiles.default=local

# Heroku define a porta na variavel PORT
server.port=${PORT:8080}

# Banco: pool pequeno (Heroku Postgres Essential tem poucas conexoes)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA: schema e responsabilidade do Flyway; Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: so o health e exposto, sem detalhes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT (segredo HMAC com no minimo 256 bits = 32 bytes)
familyctrl.jwt.secret=${JWT_SECRET}
familyctrl.jwt.issuer=family-ctrl
familyctrl.jwt.expiracao-padrao=1d
familyctrl.jwt.expiracao-lembrar=7d

# CORS: origens do front separadas por virgula
familyctrl.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
