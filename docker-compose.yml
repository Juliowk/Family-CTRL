# Banco PostgreSQL para desenvolvimento local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: familyctrl
      POSTGRES_USER: familyctrl
      POSTGRES_PASSWORD: familyctrl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyctrl -d familyctrl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
